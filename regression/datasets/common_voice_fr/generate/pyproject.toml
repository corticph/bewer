[tool.poetry]
name = "common-voice-fr-generate"
version = "0.0.0"
description = "Reproducible generator for the Common Voice French bewer regression dataset."
authors = ["Corti ML"]
package-mode = false

[tool.poetry.dependencies]
# Matches the interpreter + stack that generated the committed data.
python = ">=3.12,<3.13"
transformers = "4.46.3"
torch = "2.10.0"
librosa = "0.11.0"
huggingface-hub = "0.36.2"
numpy = "2.2.6"
tqdm = "4.68.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
