<svg width="100%" viewBox="0 0 580 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500');</style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ed8941"/>
      <stop offset="100%" stop-color="#e3d7a3"/>
    </linearGradient>
    <linearGradient id="wer-gradient" x1="0" y1="0" x2="1" y2="1">
