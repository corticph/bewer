name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🔴 Breaking changes'
    label: 'major'
    exclude-label: 'dependabot'
  - title: '🟠 New features'
    label: 'minor'
    exclude-label: 'dependabot'
  - title: '🟡 Fixes'
    label: 'patch'
    exclude-label: 'dependabot'
  - title: '📦 Dependencies'
    collapse-after: 1
    label: dependabot
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  # Pre-1.0: breaking change (major label) → minor bump, everything else → patch.
  # Revert to one-to-one mapping (major→major, minor→minor, patch→patch) when releasing 1.0.0.
  minor:
    labels:
      - 'major'
  patch:
    labels:
      - 'minor'
      - 'patch'
  default: patch
filter-by-commitish: true
template: |
  ## What's Changed
  $CHANGES

  **Full change log**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
